<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تهنئة رمضان | محمد أحمد حلمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #03051a;
            --accent: #f9e27d;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--dark-bg);
            background: radial-gradient(circle at center, #111d4a 0%, #03051a 100%);
            font-family: 'Amiri', serif;
            color: white;
            overflow-x: hidden;
        }

        /* تأثير النجوم المتساقطة */
        .background-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            z-index: -1;
        }

        /* الحاوية الرئيسية المتجاوبة */
        .container {
            width: 90%;
            max-width: 700px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--gold);
            border-radius: 30px;
            backdrop-filter: blur(15px);
            text-align: center;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.2);
            position: relative;
            animation: fadeIn 2s ease-out;
        }

        /* زخارف إسلامية */
        .container::before, .container::after {
            content: "✨";
            position: absolute;
            font-size: 30px;
            color: var(--gold);
        }
        .container::before { top: 10px; right: 10px; }
        .container::after { bottom: 10px; left: 10px; }

        h1.rm {
            font-family: 'Aref Ruqaa', serif;
            font-size: clamp(40px, 10vw, 80px); /* حجم خط متجاوب */
            color: var(--gold);
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.7);
            animation: pulse 2s infinite alternate;
        }

        .message {
            font-size: clamp(18px, 4vw, 26px);
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .name {
            display: block;
            font-size: clamp(22px, 5vw, 32px);
            color: var(--accent);
            margin: 15px 0;
            text-decoration: underline;
        }

        /* فانوس رمضان متحرك */
        .lantern {
            font-size: 60px;
            display: inline-block;
            animation: swing 3s ease-in-out infinite;
            margin-bottom: 10px;
        }

        /* أنيميشن */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes swing {
            0% { transform: rotate(-15deg); }
            50% { transform: rotate(15deg); }
            100% { transform: rotate(-15deg); }
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        /* رسالة منبثقة للتشغيل */
        #tap-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .tap-content {
            text-align: center;
            color: var(--gold);
        }
        .tap-content i { font-size: 50px; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="tap-overlay" onclick="startExperience()">
        <div class="tap-content">
            <span>🌙</span>
            <p>اضغط في أي مكان لبدء الأجواء</p>
        </div>
    </div>

    <div class="background-overlay"></div>

    <div class="container">
        <div class="lantern">🏮</div>
        <h1 class="rm">رمضان مبارك</h1>
        
        <div class="message">
            أتقدم أنا 
            <span class="name">Mohamed Ahmed Helmy Aboura</span>
            بأصدق التهاني وأطيب الأمنيات إلى جميع أصدقائي وأقاربي بمناسبة حلول شهر رمضان المبارك.
            <br><br>
            أسأل الله أن يجعله شهر خير وبركة، وأن يتقبل منا ومنكم الصيام والقيام.
            <br>
            <strong>كل عام وأنتم بخير</strong>
        </div>
    </div>

    <audio id="bg-audio" loop>
        <source src="MFMFVupioMY.mp3" type="audio/mpeg">
    </audio>

    <script>
        function startExperience() {
            // تشغيل الصوت
            var audio = document.getElementById("bg-audio");
            audio.play().catch(function(error) {
                console.log("التحميل فشل أو المتصفح منع التشغيل");
            });

            // إخفاء غطاء اللمس
            document.getElementById("tap-overlay").style.display = "none";
        }

        // محاولة إضافية لتشغيل الصوت عند التمرير (Scroll) في حال لم يضغط المستخدم
        window.addEventListener('scroll', function() {
            startExperience();
        }, { once: true });
    </script>
</body>
</html>
